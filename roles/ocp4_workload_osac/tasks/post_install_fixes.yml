---
# --------------------------------------------------------------
# Cleanup job pods in Error state
# --------------------------------------------------------------
- name: Find pods in Error state
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp4_workload_osac_namespace }}"
    field_selectors:
    - status.phase=Failed
  register: r_failed_pods

- name: Cleanup pods in Error state
  when: r_failed_pods.resources | length > 0
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: "{{ item.metadata.name }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
  loop: "{{ r_failed_pods.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# --------------------------------------------------------------
# Keycloak public URL configuration (required for browser login)
# --------------------------------------------------------------
- name: Set Keycloak hostname facts
  ansible.builtin.set_fact:
    _ocp4_workload_osac_kc_host: "keycloak-keycloak.{{ openshift_cluster_ingress_domain }}"
    _ocp4_workload_osac_kc_url: "https://keycloak-keycloak.{{ openshift_cluster_ingress_domain }}"
    _ocp4_workload_osac_ui_url: >-
      https://osac-ui-{{ ocp4_workload_osac_namespace }}.{{ openshift_cluster_ingress_domain }}

- name: Read Keycloak deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: keycloak-service
    namespace: keycloak
  register: r_kc_deploy

- name: Set Keycloak public hostname environment
  vars:
    _kc_container: "{{ r_kc_deploy.resources[0].spec.template.spec.containers[0] }}"
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: keycloak-service
    namespace: keycloak
    definition:
      spec:
        template:
          spec:
            containers:
            - name: "{{ _kc_container.name }}"
              env:
              - name: KC_HOSTNAME
                value: "{{ _ocp4_workload_osac_kc_host }}"
              - name: KC_HOSTNAME_URL
                value: "{{ _ocp4_workload_osac_kc_url }}"
              - name: KC_HOSTNAME_ADMIN_URL
                value: "{{ _ocp4_workload_osac_kc_url }}"
              - name: KC_HOSTNAME_STRICT
                value: "false"
              - name: KC_HOSTNAME_STRICT_HTTPS
                value: "false"
              - name: KC_PROXY_HEADERS
                value: xforwarded

- name: Read Keycloak CA certificate from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-tls-cert
    namespace: keycloak
  register: r_kc_tls_secret

- name: Convert Keycloak Route from passthrough to reencrypt
  kubernetes.core.k8s:
    state: patched
    api_version: route.openshift.io/v1
    kind: Route
    name: keycloak
    namespace: keycloak
    definition:
      spec:
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: "{{ r_kc_tls_secret.resources[0].data['ca.crt'] | b64decode }}"

- name: Test Keycloak admin credentials (configured user)
  ansible.builtin.uri:
    url: "{{ _ocp4_workload_osac_kc_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ ocp4_workload_osac_admin_user }}"
      password: "{{ _ocp4_workload_osac_admin_password }}"
    validate_certs: false
    status_code: [200, 400, 401]
  register: r_kc_auth_test
  failed_when: false

- name: Set effective Keycloak admin credentials
  ansible.builtin.set_fact:
    _ocp4_workload_osac_kc_admin_user: >-
      {{ ocp4_workload_osac_admin_user if r_kc_auth_test.status == 200 else 'admin' }}
    _ocp4_workload_osac_kc_admin_password: >-
      {{ _ocp4_workload_osac_admin_password if r_kc_auth_test.status == 200 else 'admin' }}

- name: Configure osac-ui Keycloak client
  community.general.keycloak_client:
    auth_keycloak_url: "{{ _ocp4_workload_osac_kc_url }}"
    auth_realm: master
    auth_client_id: admin-cli
    auth_username: "{{ _ocp4_workload_osac_kc_admin_user }}"
    auth_password: "{{ _ocp4_workload_osac_kc_admin_password }}"
    validate_certs: false
    realm: osac
    client_id: osac-ui
    state: present
    enabled: true
    public_client: true
    standard_flow_enabled: true
    direct_access_grants_enabled: false
    protocol: openid-connect
    root_url: "{{ _ocp4_workload_osac_ui_url }}"
    redirect_uris:
    - "{{ _ocp4_workload_osac_ui_url }}/callback"
    - "{{ _ocp4_workload_osac_ui_url }}/*"
    web_origins:
    - "{{ _ocp4_workload_osac_ui_url }}"
    - "+"
    attributes:
      pkce.code.challenge.method: S256
    default_client_scopes:
    - profile
    - email
    - web-origins
    client_scopes_behavior: patch
  register: r_osac_ui_client
  retries: 5
  delay: 10
  until: r_osac_ui_client is succeeded

# --------------------------------------------------------------
# Switch osac realm browser flow to combined username+password form
# (shows both fields on one page instead of username-only first page)
# --------------------------------------------------------------
- name: Get Keycloak admin token for browser flow update
  ansible.builtin.uri:
    url: "{{ _ocp4_workload_osac_kc_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ _ocp4_workload_osac_kc_admin_user }}"
      password: "{{ _ocp4_workload_osac_kc_admin_password }}"
    validate_certs: false
  register: r_kc_flow_token

- name: Get browser flow executions for osac realm
  ansible.builtin.uri:
    url: >-
      {{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/flows/browser/executions
    method: GET
    headers:
      Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
    validate_certs: false
  register: r_browser_execs

- name: Check if browser flow already uses combined username-password form
  ansible.builtin.set_fact:
    _kc_has_combined_form: >-
      {{ r_browser_execs.json
         | selectattr('providerId', 'defined')
         | selectattr('providerId', 'equalto', 'auth-username-password-form')
         | list | length > 0 }}

- name: Replace username-only form with combined username-password form
  when: not _kc_has_combined_form | bool
  block:
  - name: Find username-only execution and forms subflow
    ansible.builtin.set_fact:
      _kc_username_exec: >-
        {{ r_browser_execs.json
           | selectattr('providerId', 'defined')
           | selectattr('providerId', 'equalto', 'auth-username-form')
           | first }}
      _kc_forms_subflow_exec: >-
        {{ r_browser_execs.json
           | selectattr('authenticationFlow', 'defined')
           | selectattr('authenticationFlow', 'equalto', true)
           | selectattr('displayName', 'search', '[Ff]orm')
           | first }}

  - name: Get authentication flows to resolve forms subflow alias
    ansible.builtin.uri:
      url: "{{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/flows"
      method: GET
      headers:
        Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
      validate_certs: false
    register: r_all_flows

  - name: Resolve forms subflow alias
    ansible.builtin.set_fact:
      _kc_forms_alias: >-
        {{ (r_all_flows.json
            | selectattr('id', 'equalto', _kc_forms_subflow_exec.flowId)
            | first).alias }}

  - name: Delete username-only form execution
    ansible.builtin.uri:
      url: >-
        {{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/executions/{{ _kc_username_exec.id }}
      method: DELETE
      headers:
        Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
      validate_certs: false
      status_code: [204]

  - name: Add combined username-password form to browser forms subflow
    ansible.builtin.uri:
      url: >-
        {{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/flows/{{
        _kc_forms_alias | urlencode }}/executions/execution
      method: POST
      headers:
        Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
      body_format: json
      body:
        provider: auth-username-password-form
      validate_certs: false
      status_code: [201]

  - name: Re-read browser flow executions after modification
    ansible.builtin.uri:
      url: >-
        {{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/flows/browser/executions
      method: GET
      headers:
        Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
      validate_certs: false
    register: r_browser_execs_new

  - name: Find combined form execution in updated list
    ansible.builtin.set_fact:
      _kc_combined_exec: >-
        {{ r_browser_execs_new.json
           | selectattr('providerId', 'defined')
           | selectattr('providerId', 'equalto', 'auth-username-password-form')
           | first }}

  - name: Set combined form execution to REQUIRED
    ansible.builtin.uri:
      url: >-
        {{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/flows/browser/executions
      method: PUT
      headers:
        Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
      body_format: json
      body: "{{ _kc_combined_exec | combine({'requirement': 'REQUIRED'}) }}"
      validate_certs: false
      status_code: [202, 204]

  - name: Raise combined form priority to top of subflow
    when: (_kc_combined_exec.index | default(0) | int) > 0
    ansible.builtin.uri:
      url: >-
        {{ _ocp4_workload_osac_kc_url }}/admin/realms/osac/authentication/executions/{{
        _kc_combined_exec.id }}/raise-priority
      method: POST
      headers:
        Authorization: "Bearer {{ r_kc_flow_token.json.access_token }}"
      validate_certs: false
      status_code: [204]
    loop: "{{ range(_kc_combined_exec.index | default(0) | int) | list }}"
    loop_control:
      label: "raise {{ item + 1 }}"

# trust-manager Bundle needs: OSAC internal CA + system CAs (Google Trust Services,
# ISRG/Let's Encrypt, etc.).  useDefaultCAs: true covers all public root CAs used
# by the ingress wildcard cert, so the ingress CA chain is already trusted.
- name: Add system CAs to trust-manager ca-bundle
  kubernetes.core.k8s:
    state: patched
    api_version: trust.cert-manager.io/v1alpha1
    kind: Bundle
    name: ca-bundle
    definition:
      spec:
        sources:
        - secret:
            key: ca.crt
            name: default-ca
        - useDefaultCAs: true

# The fulfillment-api route is passthrough by default, presenting a cert signed by
# OSAC's internal default-ca (not a public CA), which browsers reject.
# Switch to reencrypt so the router (which holds the cluster wildcard cert) terminates
# TLS for the browser.  The destinationCACertificate must be the OSAC default-ca — that
# is what signed the Envoy proxy cert — NOT the OpenShift service CA.
- name: Read OSAC default-ca cert for fulfillment-api route
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: default-ca
    namespace: cert-manager
  register: r_default_ca_secret

- name: Convert fulfillment-api route from passthrough to reencrypt
  kubernetes.core.k8s:
    state: patched
    api_version: route.openshift.io/v1
    kind: Route
    name: fulfillment-api
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      spec:
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: "{{ r_default_ca_secret.resources[0].data['ca.crt'] | b64decode }}"

# https://redhat.atlassian.net/browse/OSAC-4795
# Clear vault endpoint from fulfillment deployments so they start without Vault
- name: Read fulfillment deployments for vault-endpoint patch
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
  loop:
  - fulfillment-controller
  - fulfillment-grpc-server
  register: r_fulfillment_deploys

- name: Clear --vault-endpoint from fulfillment container commands
  vars:
    _deploy: "{{ item.resources[0] }}"
    _container: "{{ _deploy.spec.template.spec.containers[0] }}"
    _patched_cmd: >-
      {{ _container.command | default([])
         | map('regex_replace', '^--vault-endpoint=.+', '--vault-endpoint=')
         | list }}
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: "{{ _deploy.metadata.name }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      spec:
        template:
          spec:
            containers:
            - name: "{{ _container.name }}"
              command: "{{ _patched_cmd }}"
  loop: "{{ r_fulfillment_deploys.results }}"
  loop_control:
    label: "{{ _deploy.metadata.name }}"

# Patch ConfigMap BEFORE the restart so the pod picks up the correct URL on start.
- name: Patch osac-ui ConfigMap fulfillment URL to internal service
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: ConfigMap
    name: osac-ui
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      data:
        FULFILLMENT_API_URL: "https://fulfillment-internal-api:8001"

- name: Restart fulfillment ingress proxy, fulfillment gRPC server, and OSAC UI
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).isoformat() }}"
  loop:
  - fulfillment-ingress-proxy
  - fulfillment-grpc-server
  - osac-ui

# --------------------------------------------------------------
# Restart fulfillment-controller first, then dedup VirtualNetworks.
# Order matters: the FC restart triggers a startup burst that creates duplicate
# VirtualNetwork CRs (informer cache empty on startup, same VN enqueued 2-3×).
# We wait 30s for the burst to complete, then dedup catches and removes them.
# --------------------------------------------------------------
- name: Restart fulfillment controller to trigger Tenant sync
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: fulfillment-controller
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).isoformat() }}"

- name: Wait for fulfillment-controller cache to warm after restart
  ansible.builtin.pause:
    seconds: 30

# The osac-operator has a race condition that creates duplicate VirtualNetwork CRs
# (same UUID label, generated names). Remove extras and re-trigger reconciliation.
- name: Get all VirtualNetwork CRs
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: VirtualNetwork
    namespace: "{{ ocp4_workload_osac_namespace }}"
  register: r_vns

- name: Identify duplicate VirtualNetworks to delete (keep first name per UUID)
  vars:
    _sorted: "{{ r_vns.resources | sort(attribute='metadata.name') }}"
    _names: "{{ _sorted | map(attribute='metadata.name') | list }}"
    _uuids: "{{ _sorted | json_query('[].metadata.labels.\"osac.openshift.io/virtualnetwork-uuid\"') }}"
    _keep: "{{ dict(_uuids[::-1] | zip(_names[::-1])) | dict2items | map(attribute='value') | list }}"
  ansible.builtin.set_fact:
    _duplicate_vns: "{{ _names | difference(_keep) }}"

- name: Clear finalizers from duplicate VirtualNetworks
  when: _duplicate_vns | length > 0
  kubernetes.core.k8s:
    state: patched
    api_version: osac.openshift.io/v1alpha1
    kind: VirtualNetwork
    name: "{{ item }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      metadata:
        finalizers: []
  loop: "{{ _duplicate_vns }}"

- name: Delete duplicate VirtualNetworks (wait for full removal)
  when: _duplicate_vns | length > 0
  kubernetes.core.k8s:
    state: absent
    api_version: osac.openshift.io/v1alpha1
    kind: VirtualNetwork
    name: "{{ item }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
    wait: true
    wait_timeout: 300
  loop: "{{ _duplicate_vns }}"

- name: Annotate remaining VirtualNetworks to trigger reconciliation
  when: _duplicate_vns | length > 0
  kubernetes.core.k8s:
    state: patched
    api_version: osac.openshift.io/v1alpha1
    kind: VirtualNetwork
    name: "{{ item.metadata.name }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
    definition:
      metadata:
        annotations:
          reconcile.osac.openshift.io/ts: "{{ now(utc=true).isoformat() }}"
  loop: "{{ r_vns.resources | rejectattr('metadata.name', 'in', _duplicate_vns) | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
