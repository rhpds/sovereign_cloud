---
- name: Find pods in Error state
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp4_workload_osac_namespace }}"
    field_selectors:
    - status.phase=Failed
  register: r_failed_pods

- name: Cleanup pods in Error state
  when: r_failed_pods.resources | length > 0
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: "{{ item.metadata.name }}"
    namespace: "{{ ocp4_workload_osac_namespace }}"
  loop: "{{ r_failed_pods.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

