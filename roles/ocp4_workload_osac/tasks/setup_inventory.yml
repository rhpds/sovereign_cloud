---
- name: Set bastion host from inventory group
  when: "'bastions' in groups and groups['bastions'] | length > 0"
  ansible.builtin.set_fact:
    _bastion_host: "{{ groups['bastions'][0] }}"

- name: Add bastion host dynamically from variables
  when:
  - _bastion_host is not defined
  - bastion_ansible_host is defined
  - bastion_ansible_user is defined
  - bastion_ansible_ssh_pass is defined
  block:
  - name: Add bastion to inventory
    ansible.builtin.add_host:
      name: "{{ bastion_ansible_host }}"
      groups: bastions
      ansible_user: "{{ bastion_ansible_user }}"
      ansible_ssh_pass: "{{ bastion_ansible_ssh_pass }}"
      ansible_port: "{{ bastion_ansible_port | default(22) }}"

  - name: Set bastion host fact from variables
    ansible.builtin.set_fact:
      _bastion_host: "{{ bastion_ansible_host }}"

- name: Abort install if no bastion available
  when: _bastion_host is not defined
  ansible.builtin.fail:
    msg: "No bastion host available - aborting installation."

- name: Find bastion SSH private key
  delegate_to: "{{ _bastion_host }}"
  become: true
  ansible.builtin.find:
    paths: /root/.ssh
    patterns: "bastion_*"
    excludes: "*.pub"
    file_type: file
  register: _bastion_key_files

- name: Fetch bastion SSH private key
  delegate_to: "{{ _bastion_host }}"
  become: true
  ansible.builtin.slurp:
    src: "{{ _bastion_key_files.files[0].path }}"
  register: _bastion_key

- name: Write bastion SSH private key to EE
  ansible.builtin.copy:
    content: "{{ _bastion_key.content | b64decode }}"
    dest: /tmp/bmf_vm_id
    mode: "0600"

- name: Add BMF VM to inventory
  ansible.builtin.add_host:
    name: bmf_vm
    ansible_host: 10.10.10.2
    ansible_user: root
    ansible_ssh_private_key_file: /tmp/bmf_vm_id
    # Password-based bastion (openshift-workloads vars) vs. key-based bastion from inventory (agnosticd ssh config)
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      {% if bastion_ansible_ssh_pass is defined %}
      -o 'ProxyCommand=sshpass -p {{ bastion_ansible_ssh_pass }} ssh -W %h:%p
      -p {{ bastion_ansible_port | default(22) }} -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null {{ bastion_ansible_user }}@{{ bastion_ansible_host }}'
      {% else %}
      -o 'ProxyCommand=ssh -F {{ hostvars.localhost.ansible_ssh_config }} -W %h:%p {{ _bastion_host }}'
      {% endif %}
