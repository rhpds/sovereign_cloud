---
# ponytail: no async — async+delegate_to is broken in AAP; tee keeps SSH alive
- name: "OSAC Phase 1: Install infra"
  delegate_to: "{{ _bastion_host }}"
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      make install-infra
      PLATFORM=openshift
      PROFILE={{ ocp4_workload_osac_installer_profile }}
      NS={{ ocp4_workload_osac_namespace }}
      2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
    chdir: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}"
  changed_when: true

- name: Make lvms-vg1 the default StorageClass
  when: ocp4_workload_osac_lvms_enabled | bool
  block:
  - name: Get all StorageClasses
    kubernetes.core.k8s_info:
      api_version: storage.k8s.io/v1
      kind: StorageClass
    register: r_all_storage_classes

  - name: Remove default annotation from non-LVMS StorageClasses
    when:
    - item.metadata.annotations is defined
    - item.metadata.annotations['storageclass.kubernetes.io/is-default-class'] | default('false') == 'true'
    - item.metadata.name != 'lvms-vg1'
    kubernetes.core.k8s:
      state: patched
      api_version: storage.k8s.io/v1
      kind: StorageClass
      name: "{{ item.metadata.name }}"
      definition:
        metadata:
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
    loop: "{{ r_all_storage_classes.resources | default([]) }}"
    loop_control:
      label: "{{ item.metadata.name }}"

  - name: Set lvms-vg1 as default StorageClass
    kubernetes.core.k8s:
      state: patched
      api_version: storage.k8s.io/v1
      kind: StorageClass
      name: lvms-vg1
      definition:
        metadata:
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"

- name: "OSAC Phase 2: Install OSAC"
  delegate_to: "{{ _bastion_host }}"
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      make install-osac
      PLATFORM=openshift
      PROFILE={{ ocp4_workload_osac_installer_profile }}
      NS={{ ocp4_workload_osac_namespace }}
      2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
    chdir: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}"
  changed_when: true
