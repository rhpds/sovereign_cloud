---
- name: Remove pre-existing cert-manager OperatorGroup to avoid conflict with Helm
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    name: cert-manager-operator
    namespace: cert-manager-operator
  failed_when: false

- name: Adopt pre-existing cert-manager namespaces for Helm
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: osac-operators
          meta.helm.sh/release-namespace: osac-operators
  loop:
  - cert-manager-operator
  - cert-manager
  register: r_adopt_ns
  failed_when:
  - r_adopt_ns is failed
  - "'not found' not in (r_adopt_ns.msg | default(''))"

- name: Check for existing OSAC namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop:
  - osac-prereqs
  - "{{ ocp4_workload_osac_namespace }}"
  register: r_osac_namespaces

- name: Delete leftover Helm hook jobs from previous runs
  when: item.resources | length > 0
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ item.item }}"
    label_selectors:
    - app.kubernetes.io/managed-by=Helm
  loop: "{{ r_osac_namespaces.results }}"
  loop_control:
    label: "{{ item.item }}"
  failed_when: false

- name: Set Helm download URL
  ansible.builtin.set_fact:
    _ocp4_workload_osac_helm_url: >-
      {{ '{0}/helm/latest/helm-linux-amd64.tar.gz'.format(ocp4_workload_osac_helm_mirror) }}

- name: Run on Bastion
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  block:
  - name: Root operations
    become: true
    block:
    - name: Install make
      ansible.builtin.package:
        name: make
        state: present

    - name: Install Helm
      ansible.builtin.unarchive:
        src: "{{ _ocp4_workload_osac_helm_url }}"
        remote_src: true
        dest: /usr/bin
        mode: ug=rwx,go=rx
        owner: root
        group: root
      retries: 10
      register: r_helm_install
      until: r_helm_install is success
      delay: 30

    - name: Rename helm binary
      ansible.builtin.copy:
        src: /usr/bin/helm-linux-amd64
        dest: /usr/bin/helm
        remote_src: true
        mode: ug=rwx,go=rx
        owner: root
        group: root

    - name: Remove original helm binary
      ansible.builtin.file:
        path: /usr/bin/helm-linux-amd64
        state: absent

  - name: Ensure osac-installer directory does not exist
    ansible.builtin.file:
      path: "~{{ ansible_user }}/osac-installer"
      state: absent

  - name: Clone osac-installer and initialize submodules
    ansible.builtin.git:
      repo: "{{ ocp4_workload_osac_installer_repo }}"
      dest: "~{{ ansible_user }}/osac-installer"
      recursive: true
      version: "{{ ocp4_workload_osac_installer_version }}"

  - name: Patch Makefile to add --take-ownership to helm upgrade calls
    ansible.builtin.replace:
      path: "~{{ ansible_user }}/osac-installer/Makefile"
      regexp: '--timeout'
      replace: '--take-ownership --timeout'

  - name: Increase backoffLimit on prereqs hook jobs
    ansible.builtin.replace:
      path: "~{{ ansible_user }}/osac-installer/charts/osac-prereqs/templates/hooks/{{ item }}"
      regexp: 'backoffLimit: 5'
      replace: 'backoffLimit: 30'
    loop:
    - configure-cnv.yaml
    - configure-mce.yaml
    - configure-metallb.yaml

  - name: Ensure values directory exists
    ansible.builtin.file:
      path: "~{{ ansible_user }}/osac-installer/values/demo"
      state: directory
      mode: ug=rwx,go=rx

  - name: Write OSAC values file
    ansible.builtin.template:
      src: values.yaml.j2
      dest: "~{{ ansible_user }}/osac-installer/values/demo/values.yaml"
      mode: ug=rw,go=r

  - name: Write AAP license file
    ansible.builtin.copy:
      content: "{{ ocp4_workload_osac_aap_license }}"
      dest: "~{{ ansible_user }}/osac-installer/values/demo/license.zip"
      mode: ug=rw,go=r

  - name: "OSAC Phase 1: Install operators"
    ansible.builtin.shell:
      cmd: >-
        set -o pipefail;
        make install-operators
        VALUES_FILE=values/demo/values.yaml
        INSTALLER_NAMESPACE={{ ocp4_workload_osac_namespace }}
        2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
      chdir: "~{{ ansible_user }}/osac-installer"
    changed_when: true
    async: 3600
    poll: 30

- name: Wait for CNV and MCE operators to be ready
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ item.namespace }}"
    label_selectors:
    - "operators.coreos.com/{{ item.operator }}"
  loop:
  - operator: kubevirt-hyperconverged.openshift-cnv
    namespace: openshift-cnv
  - operator: multicluster-engine.multicluster-engine
    namespace: multicluster-engine
  loop_control:
    label: "{{ item.operator }}"
  register: r_csv_wait
  until:
  - r_csv_wait.resources | length > 0
  - r_csv_wait.resources[0].status.phase | default('') == 'Succeeded'
  retries: 60
  delay: 30

- name: Rollback failed osac-prereqs Helm release
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: >-
      if helm status osac-prereqs -n osac-prereqs 2>/dev/null | grep -q 'STATUS: failed'; then
        helm rollback osac-prereqs 0 -n osac-prereqs;
      fi
    chdir: "~{{ ansible_user }}/osac-installer"
  changed_when: true

- name: "OSAC Phase 2: Install prerequisites"
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      make install-prereqs
      VALUES_FILE=values/demo/values.yaml
      INSTALLER_NAMESPACE={{ ocp4_workload_osac_namespace }}
      2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
    chdir: "~{{ ansible_user }}/osac-installer"
  changed_when: true
  async: 3600
  poll: 30

- name: "OSAC Phase 3: Install OSAC"
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      make install-osac
      VALUES_FILE=values/demo/values.yaml
      INSTALLER_NAMESPACE={{ ocp4_workload_osac_namespace }}
      2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
    chdir: "~{{ ansible_user }}/osac-installer"
  changed_when: true
  async: 3600
  poll: 30

- name: Create hub-access ClusterRole and ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    template: "{{ item }}"
  loop:
  - clusterrole-hub-access.yaml.j2
  - clusterrolebinding-hub-access.yaml.j2

- name: Restart fulfillment controller to trigger tenant sync
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc rollout restart deploy/fulfillment-controller
      -n {{ ocp4_workload_osac_namespace }}
  changed_when: true

- name: Wait for tenant shared to be created
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Tenant
    name: shared
    namespace: "{{ ocp4_workload_osac_namespace }}"
  register: r_tenant_wait
  until:
  - r_tenant_wait.resources | length > 0
  - r_tenant_wait.resources[0].status.phase | default('') == 'Ready'
  retries: 30
  delay: 10

- name: Patch tenant shared storage class status
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc patch tenant shared
      -n {{ ocp4_workload_osac_namespace }}
      --type=merge
      --subresource=status
      -p '{"status":{"storageClasses":[{"name":"{{ ocp4_workload_osac_storage_class }}","tier":"default"}]}}'
  changed_when: true

- name: Label storage class for OSAC tenant
  kubernetes.core.k8s:
    state: patched
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ ocp4_workload_osac_storage_class }}"
    definition:
      metadata:
        labels:
          osac.openshift.io/tenant: Default
          osac.openshift.io/storage-tier: default

# --------------------------------------------------
# Keycloak public URL configuration (required for browser login)
# --------------------------------------------------

- name: Set Keycloak hostname facts
  ansible.builtin.set_fact:
    _ocp4_workload_osac_kc_host: "keycloak-keycloak.{{ openshift_cluster_ingress_domain }}"
    _ocp4_workload_osac_kc_url: "https://keycloak-keycloak.{{ openshift_cluster_ingress_domain }}"
    _ocp4_workload_osac_ui_url: >-
      https://osac-ui-{{ ocp4_workload_osac_namespace }}.{{ openshift_cluster_ingress_domain }}

- name: Add public hostname to Keycloak TLS certificate SAN
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      KC_HOST="{{ _ocp4_workload_osac_kc_host }}"
      CERT_JSON=$(oc get certificate keycloak-tls -n keycloak -o json)
      if echo "$CERT_JSON" | python3 -c "import sys,json; dns=json.load(sys.stdin)['spec'].get('dnsNames',[]); raise SystemExit(0 if '$KC_HOST' in dns else 1)"; then
        echo "SAN already present"
      else
        echo "$CERT_JSON" | python3 -c "
      import sys, json
      c = json.load(sys.stdin)
      dns = c['spec'].setdefault('dnsNames', [])
      dns.append('$KC_HOST')
      c['spec']['dnsNames'] = list(set(dns))
      c['metadata'].pop('managedFields', None)
      c['metadata'].pop('resourceVersion', None)
      json.dump(c, sys.stdout)" | oc apply -f -
        oc annotate certificate keycloak-tls -n keycloak \
          cert-manager.io/force-renewal="$(date +%s)" --overwrite
      fi
  changed_when: true

- name: Wait for Keycloak TLS certificate to be ready
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    name: keycloak-tls
    namespace: keycloak
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 180

- name: Set Keycloak public hostname environment
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc set env deploy/keycloak-service -n keycloak
      KC_HOSTNAME={{ _ocp4_workload_osac_kc_host }}
      KC_HOSTNAME_URL={{ _ocp4_workload_osac_kc_url }}
      KC_HOSTNAME_ADMIN_URL={{ _ocp4_workload_osac_kc_url }}
      KC_HOSTNAME_STRICT=false
      KC_HOSTNAME_STRICT_HTTPS=false
      KC_PROXY_HEADERS=xforwarded
  changed_when: true

- name: Wait for Keycloak rollout
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: oc rollout status deploy/keycloak-service -n keycloak --timeout=180s
  changed_when: false

- name: Convert Keycloak route from passthrough to reencrypt
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      TERM=$(oc get route keycloak -n keycloak -o jsonpath='{.spec.tls.termination}')
      if [ "$TERM" = "reencrypt" ]; then
        echo "Route already reencrypt"
        exit 0
      fi
      CA_PEM=$(oc get secret keycloak-tls-cert -n keycloak -o jsonpath='{.data.ca\.crt}' | base64 -d)
      oc get route keycloak -n keycloak -o json | python3 -c "
      import sys, json
      route = json.load(sys.stdin)
      tls = route['spec'].setdefault('tls', {})
      tls['termination'] = 'reencrypt'
      tls['insecureEdgeTerminationPolicy'] = 'Redirect'
      tls['destinationCACertificate'] = '''$CA_PEM'''
      route['metadata'].pop('managedFields', None)
      route['metadata'].pop('resourceVersion', None)
      json.dump(route, sys.stdout)" | oc apply -f -
  changed_when: true

- name: Wait for Keycloak to be reachable after route change
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      curl -sk -o /dev/null -w '%{http_code}'
      {{ _ocp4_workload_osac_kc_url }}/realms/osac/
  register: r_kc_check
  until: r_kc_check.stdout == '200'
  retries: 30
  delay: 10
  changed_when: false

- name: Configure osac-ui Keycloak client redirect URIs
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      KC_URL="{{ _ocp4_workload_osac_kc_url }}"
      UI_URL="{{ _ocp4_workload_osac_ui_url }}"
      for i in $(seq 1 5); do
        RESP=$(curl -sk -X POST \
          "${KC_URL}/realms/master/protocol/openid-connect/token" \
          -d "grant_type=password&client_id=admin-cli&username=admin&password=admin")
        TOKEN=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])' 2>/dev/null) && break
        sleep 10
      done
      if [ -z "${TOKEN:-}" ]; then
        echo "Failed to get Keycloak admin token after 5 attempts" >&2
        exit 1
      fi
      EXISTING=$(curl -sk -H "Authorization: Bearer $TOKEN" \
        "${KC_URL}/admin/realms/osac/clients?clientId=osac-ui")
      CLIENT_UUID=$(echo "$EXISTING" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")' 2>/dev/null)
      if [ -n "$CLIENT_UUID" ]; then
        CURRENT=$(curl -sk -H "Authorization: Bearer $TOKEN" \
          "${KC_URL}/admin/realms/osac/clients/${CLIENT_UUID}")
        MERGED=$(echo "$CURRENT" | python3 -c "
      import sys, json
      c = json.load(sys.stdin)
      c['rootUrl'] = '${UI_URL}'
      c['redirectUris'] = ['${UI_URL}/callback', '${UI_URL}/*']
      c['webOrigins'] = ['${UI_URL}', '+']
      c.setdefault('attributes', {})['pkce.code.challenge.method'] = 'S256'
      json.dump(c, sys.stdout)")
        echo "$MERGED" | curl -sk -X PUT -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          "${KC_URL}/admin/realms/osac/clients/${CLIENT_UUID}" -d @-
        echo "updated osac-ui client"
      else
        python3 -c "
      import json
      print(json.dumps({
        'clientId': 'osac-ui', 'enabled': True, 'publicClient': True,
        'standardFlowEnabled': True, 'directAccessGrantsEnabled': False,
        'attributes': {'pkce.code.challenge.method': 'S256'},
        'rootUrl': '${UI_URL}',
        'redirectUris': ['${UI_URL}/callback', '${UI_URL}/*'],
        'webOrigins': ['${UI_URL}', '+'],
        'protocol': 'openid-connect',
      }))" | curl -sk -X POST -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          "${KC_URL}/admin/realms/osac/clients" -d @-
        echo "created osac-ui client"
      fi
  changed_when: true

- name: Restart OSAC UI and fulfillment controller
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc rollout restart
      deploy/osac-ui
      deploy/fulfillment-controller
      -n {{ ocp4_workload_osac_namespace }}
  changed_when: true

- name: Wait for OSAC UI rollout
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc rollout status deploy/osac-ui
      -n {{ ocp4_workload_osac_namespace }}
      --timeout=180s
  changed_when: false

# --------------------------------------------------
# OSAC AAP token (required for operator to reach AAP)
# --------------------------------------------------

- name: Wait for AAP token creation job to complete
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc wait --for=condition=Complete
      job/osac-aap-create-token
      -n {{ ocp4_workload_osac_namespace }}
      --timeout=600s
  changed_when: false

- name: Patch OSAC_AAP_TOKEN onto osac-operator deployment
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command:
    cmd: >-
      oc patch deployment/osac-operator
      -n {{ ocp4_workload_osac_namespace }}
      --type=json
      -p='[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"OSAC_AAP_TOKEN","valueFrom":{"secretKeyRef":{"name":"osac-aap-api-token","key":"token"}}}}]'
  changed_when: true
