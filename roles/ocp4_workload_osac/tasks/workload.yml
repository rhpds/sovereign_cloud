---
- name: Remove pre-existing cert-manager OperatorGroup to avoid conflict with Helm
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    name: cert-manager-operator
    namespace: cert-manager-operator
  failed_when: false

- name: Adopt pre-existing cert-manager namespaces for Helm
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: osac-operators
          meta.helm.sh/release-namespace: osac-operators
  loop:
  - cert-manager-operator
  - cert-manager
  register: r_adopt_ns
  failed_when:
  - r_adopt_ns is failed
  - "'not found' not in (r_adopt_ns.msg | default(''))"

- name: Check for existing OSAC namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
  loop:
  - osac-prereqs
  - "{{ ocp4_workload_osac_namespace }}"
  register: r_osac_namespaces

- name: Delete leftover Helm hook jobs from previous runs
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ item.item }}"
    label_selectors:
    - app.kubernetes.io/managed-by=Helm
  loop: "{{ r_osac_namespaces.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.resources | length > 0
  failed_when: false

- name: Set Helm download URL
  ansible.builtin.set_fact:
    _ocp4_workload_osac_helm_url: >-
      {{ '{0}/helm/latest/helm-linux-amd64.tar.gz'.format(ocp4_workload_osac_helm_mirror) }}

- name: Run on Bastion
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  block:
  - name: Root operations
    become: true
    block:
    - name: Install make
      ansible.builtin.package:
        name: make
        state: present

    - name: Install Helm
      ansible.builtin.unarchive:
        src: "{{ _ocp4_workload_osac_helm_url }}"
        remote_src: true
        dest: /usr/bin
        mode: ug=rwx,go=rx
        owner: root
        group: root
      retries: 10
      register: r_helm_install
      until: r_helm_install is success
      delay: 30

    - name: Rename helm binary
      ansible.builtin.copy:
        src: /usr/bin/helm-linux-amd64
        dest: /usr/bin/helm
        remote_src: true
        mode: ug=rwx,go=rx
        owner: root
        group: root

    - name: Remove original helm binary
      ansible.builtin.file:
        path: /usr/bin/helm-linux-amd64
        state: absent

  - name: Ensure osac-installer directory does not exist
    ansible.builtin.file:
      path: "~{{ ansible_user }}/osac-installer"
      state: absent

  - name: Clone osac-installer and initialize submodules
    ansible.builtin.git:
      repo: "{{ ocp4_workload_osac_installer_repo }}"
      dest: "~{{ ansible_user }}/osac-installer"
      recursive: true
      version: "{{ ocp4_workload_osac_installer_version }}"

  - name: Patch Makefile to add --take-ownership to helm upgrade calls
    ansible.builtin.replace:
      path: "~{{ ansible_user }}/osac-installer/Makefile"
      regexp: '--timeout'
      replace: '--take-ownership --timeout'

  - name: Ensure values directory exists
    ansible.builtin.file:
      path: "~{{ ansible_user }}/osac-installer/values/demo"
      state: directory
      mode: ug=rwx,go=rx

  - name: Write OSAC values file
    ansible.builtin.template:
      src: values.yaml.j2
      dest: "~{{ ansible_user }}/osac-installer/values/demo/values.yaml"
      mode: ug=rw,go=r

  - name: Write AAP license file
    ansible.builtin.copy:
      content: "{{ ocp4_workload_osac_aap_license }}"
      dest: "~{{ ansible_user }}/osac-installer/values/demo/license.zip"
      mode: ug=rw,go=r

  - name: "OSAC Phase 1: Install operators"
    ansible.builtin.shell:
      cmd: >-
        set -o pipefail;
        make install-operators
        VALUES_FILE=values/demo/values.yaml
        INSTALLER_NAMESPACE={{ ocp4_workload_osac_namespace }}
        2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
      chdir: "~{{ ansible_user }}/osac-installer"
    changed_when: true
    async: 3600
    poll: 30

- name: Wait for CNV and MCE operators to be ready
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ item.namespace }}"
    label_selectors:
    - "operators.coreos.com/{{ item.operator }}"
  loop:
  - operator: kubevirt-hyperconverged.openshift-cnv
    namespace: openshift-cnv
  - operator: multicluster-engine.multicluster-engine
    namespace: multicluster-engine
  loop_control:
    label: "{{ item.operator }}"
  register: r_csv_wait
  until:
  - r_csv_wait.resources | length > 0
  - r_csv_wait.resources[0].status.phase | default('') == 'Succeeded'
  retries: 60
  delay: 30

- name: "OSAC Phase 2: Install prerequisites"
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      make install-prereqs
      VALUES_FILE=values/demo/values.yaml
      INSTALLER_NAMESPACE={{ ocp4_workload_osac_namespace }}
      2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
    chdir: "~{{ ansible_user }}/osac-installer"
  changed_when: true
  async: 3600
  poll: 30

- name: "OSAC Phase 3: Install OSAC"
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      make install-osac
      VALUES_FILE=values/demo/values.yaml
      INSTALLER_NAMESPACE={{ ocp4_workload_osac_namespace }}
      2>&1 | tee -a ~{{ ansible_user }}/.osac_install.log
    chdir: "~{{ ansible_user }}/osac-installer"
  changed_when: true
  async: 3600
  poll: 30

- name: Patch tenant shared storage class status
  ansible.builtin.command:
    cmd: >-
      oc patch tenant shared
      -n {{ ocp4_workload_osac_namespace }}
      --type=merge
      --subresource=status
      -p '{"status":{"storageClasses":[{"name":"{{ ocp4_workload_osac_storage_class }}","tier":"default"}]}}'
  changed_when: true

- name: Label storage class for OSAC tenant
  kubernetes.core.k8s:
    state: patched
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ ocp4_workload_osac_storage_class }}"
    definition:
      metadata:
        labels:
          osac.openshift.io/tenant: Default
          osac.openshift.io/storage-tier: default
