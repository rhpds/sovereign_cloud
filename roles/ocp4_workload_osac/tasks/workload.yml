---
- name: Call setup_inventory.yml
  ansible.builtin.include_tasks: setup_inventory.yml

- name: Call setup_bmf_vm.yml
  ansible.builtin.include_tasks: setup_bmf_vm.yml

- name: Generate passwords if not provided
  ansible.builtin.include_tasks: setup_passwords.yml

- name: Call pre_install_tasks.yml
  ansible.builtin.include_tasks: pre_install_tasks.yml

- name: Call setup_helm_options.yml
  ansible.builtin.include_tasks: setup_helm_options.yml

- name: Call install_osac.yml
  ansible.builtin.include_tasks: install_osac.yml

- name: Call install_virtctl.yml
  when: ocp4_workload_osac_install_virtctl | default(false) | bool
  ansible.builtin.include_tasks: install_virtctl.yml

- name: Call post_install_fixes.yml
  ansible.builtin.include_tasks: post_install_fixes.yml

- name: Call setup_caas.yml
  when: ocp4_workload_osac_bmf_enabled | bool
  ansible.builtin.include_tasks: setup_caas.yml

- name: Call agd_user_info.yml
  ansible.builtin.include_tasks: agd_user_info.yml
