---
- name: Set Helm download URL
  ansible.builtin.set_fact:
    _ocp4_workload_osac_helm_url: >-
      {{ '{0}/helm/latest/helm-linux-amd64.tar.gz'.format(ocp4_workload_osac_helm_mirror) }}

- name: Download AAP license from S3 into the Execution Environment
  amazon.aws.s3_object:
    bucket: "{{ ocp4_workload_osac_aap_license_s3_url | urlsplit('hostname') | split('.') | first }}"
    object: "{{ ocp4_workload_osac_aap_license_s3_url | urlsplit('path') | regex_replace('^/', '') }}"
    dest: /tmp/aap-license.zip
    mode: get
    aws_access_key: "{{ ocp4_workload_osac_aap_license_s3_access_key_id }}"
    aws_secret_key: "{{ ocp4_workload_osac_aap_license_s3_secret_access_key }}"
    region: >-
      {{ ocp4_workload_osac_aap_license_s3_url | urlsplit('hostname')
          | regex_replace('^.*\.s3\.([^.]+)\.amazonaws\.com$', '\1') }}

- name: Label storage class for OSAC Tenant shared (default)
  when:
  - not ocp4_workload_osac_lvms_enabled | bool
  - ocp4_workload_osac_ceph_storage_class | default("") | length > 0
  kubernetes.core.k8s:
    state: patched
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ ocp4_workload_osac_ceph_storage_class }}"
    definition:
      metadata:
        labels:
          osac.openshift.io/tenant: shared
          osac.openshift.io/storage-tier: default

- name: Label storage class for OSAC Tenant shared (local)
  when:
  - not ocp4_workload_osac_lvms_enabled | bool
  - ocp4_workload_osac_ceph_storage_class_local | default("") | length > 0
  kubernetes.core.k8s:
    state: patched
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ ocp4_workload_osac_ceph_storage_class_local }}"
    definition:
      metadata:
        labels:
          osac.openshift.io/tenant: shared
          osac.openshift.io/storage-tier: local

- name: Set up Bastion VM
  delegate_to: "{{ _bastion_host }}"
  block:
  - name: Root operations
    become: true
    block:
    - name: Install make
      ansible.builtin.package:
        name: make
        state: present

    - name: Install Helm
      ansible.builtin.unarchive:
        src: "{{ _ocp4_workload_osac_helm_url }}"
        remote_src: true
        dest: /usr/bin
        mode: ug=rwx,go=rx
        owner: root
        group: root
      retries: 10
      register: r_helm_install
      until: r_helm_install is success
      delay: 30

    - name: Rename Helm binary
      ansible.builtin.copy:
        src: /usr/bin/helm-linux-amd64
        dest: /usr/bin/helm
        remote_src: true
        mode: ug=rwx,go=rx
        owner: root
        group: root

    - name: Remove original Helm binary
      ansible.builtin.file:
        path: /usr/bin/helm-linux-amd64
        state: absent

    - name: Install OSAC CLI
      ansible.builtin.get_url:
        url: >-
          https://github.com/osac-project/osac/releases/download/fulfillment-service%2F{{
          ocp4_workload_osac_cli_version }}/osac_Linux_x86_64
        dest: /usr/local/bin/osac
        mode: ug=rwx,o=rx
        owner: root
        group: root
        force: true
      retries: 3
      delay: 10
      register: r_osac_cli
      until: r_osac_cli is success

  - name: Ensure osac directory does not exist
    ansible.builtin.file:
      path: "~{{ ansible_user }}/osac"
      state: absent

  - name: Clone osac repository from GitHub
    ansible.builtin.git:
      repo: "{{ ocp4_workload_osac_repo }}"
      dest: "~{{ ansible_user }}/osac"
      recursive: true
      version: "{{ ocp4_workload_osac_repo_version }}"
      depth: 1

  - name: Copy AAP license from Execution Environment to the Installer directory
    ansible.builtin.copy:
      src: /tmp/aap-license.zip
      dest: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}//values/{{ ocp4_workload_osac_installer_profile }}"
      mode: ug=rw,go=r
