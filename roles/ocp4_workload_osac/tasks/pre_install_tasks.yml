---
- name: Remove pre-existing cert-manager OperatorGroup to avoid conflict with Helm deploy
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    name: cert-manager-operator-og
    namespace: cert-manager-operator
  failed_when: false

- name: Adopt pre-existing cert-manager namespaces for Helm
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: osac-operators
          meta.helm.sh/release-namespace: osac-operators
  loop:
  - cert-manager-operator
  - cert-manager
  register: r_adopt_ns
  failed_when:
  - r_adopt_ns is failed
  - "'not found' not in (r_adopt_ns.msg | default(''))"

- name: Set Helm download URL
  ansible.builtin.set_fact:
    _ocp4_workload_osac_helm_url: >-
      {{ '{0}/helm/latest/helm-linux-amd64.tar.gz'.format(ocp4_workload_osac_helm_mirror) }}

- name: Run on Bastion
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  block:
  - name: Root operations
    become: true
    block:
    - name: Install make
      ansible.builtin.package:
        name: make
        state: present

    - name: Install Helm
      ansible.builtin.unarchive:
        src: "{{ _ocp4_workload_osac_helm_url }}"
        remote_src: true
        dest: /usr/bin
        mode: ug=rwx,go=rx
        owner: root
        group: root
      retries: 10
      register: r_helm_install
      until: r_helm_install is success
      delay: 30

    - name: Rename helm binary
      ansible.builtin.copy:
        src: /usr/bin/helm-linux-amd64
        dest: /usr/bin/helm
        remote_src: true
        mode: ug=rwx,go=rx
        owner: root
        group: root

    - name: Remove original helm binary
      ansible.builtin.file:
        path: /usr/bin/helm-linux-amd64
        state: absent

  - name: Ensure osac directory does not exist
    ansible.builtin.file:
      path: "~{{ ansible_user }}/osac"
      state: absent

  - name: Clone osac repository from GitHub
    ansible.builtin.git:
      repo: "{{ ocp4_workload_osac_repo }}"
      dest: "~{{ ansible_user }}/osac"
      recursive: true
      version: "{{ ocp4_workload_osac_repo_version }}"
      depth: 1

  - name: Ensure Makefile uses bash shell
    ansible.builtin.lineinfile:
      path: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/Makefile"
      line: "SHELL := /bin/bash"
      insertbefore: BOF

  - name: Patch Makefile to add --take-ownership to helm upgrade calls
    ansible.builtin.replace:
      path: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/Makefile"
      regexp: '--timeout'
      replace: '--take-ownership --timeout'

  - name: Set Keycloak chart resources path
    ansible.builtin.set_fact:
      _ocp4_workload_osac_kc_resources: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-prereqs/templates/keycloak/resources.yaml

  - name: Patch Keycloak admin credentials in chart
    ansible.builtin.replace:
      path: "{{ _ocp4_workload_osac_kc_resources }}"
      regexp: '(name: KEYCLOAK_ADMIN\n\s+value: )admin(\n\s+- name: KEYCLOAK_ADMIN_PASSWORD\n\s+value: )admin'
      replace: '\g<1>{{ ocp4_workload_osac_admin_user }}\g<2>{{ _ocp4_workload_osac_admin_password }}'

  - name: Patch admin username in set-passwords script
    ansible.builtin.replace:
      path: "{{ _ocp4_workload_osac_kc_resources }}"
      regexp: "-d 'username=admin'"
      replace: "-d 'username={{ ocp4_workload_osac_admin_user }}'"

  - name: Patch admin password in set-passwords script
    ansible.builtin.replace:
      path: "{{ _ocp4_workload_osac_kc_resources }}"
      regexp: "-d 'password=admin'"
      replace: "-d 'password={{ _ocp4_workload_osac_admin_password }}'"

  - name: Patch user passwords in set-passwords script
    ansible.builtin.replace:
      path: "{{ _ocp4_workload_osac_kc_resources }}"
      regexp: '"foobar"'
      replace: '"{{ _ocp4_workload_osac_user_password }}"'

  - name: Add admin user to set-passwords script
    ansible.builtin.lineinfile:
      path: "{{ _ocp4_workload_osac_kc_resources }}"
      insertafter: 'Setting passwords for all tenant users'
      line: '    set_password "{{ ocp4_workload_osac_admin_user }}" "{{ _ocp4_workload_osac_admin_password }}"'

  - name: Ensure values directory exists
    ansible.builtin.file:
      path: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/demo"
      state: directory
      mode: ug=rwx,go=rx

  - name: Write OSAC values file
    ansible.builtin.template:
      src: values.yaml.j2
      dest: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/demo/values.yaml"
      mode: ug=rw,go=r

  - name: Download AAP licence from S3
    amazon.aws.s3_object:
      bucket: "{{ ocp4_workload_osac_aap_licence_s3_url | urlsplit('hostname') | split('.') | first }}"
      object: "{{ ocp4_workload_osac_aap_licence_s3_url | urlsplit('path') | regex_replace('^/', '') }}"
      dest: /tmp/aap-licence.zip
      mode: get
      access_key: "{{ ocp4_workload_osac_aap_licence_s3_access_key_id }}"
      secret_key: "{{ ocp4_workload_osac_aap_licence_s3_secret_access_key }}"
      region: >-
        {{ ocp4_workload_osac_aap_licence_s3_url | urlsplit('hostname')
           | regex_replace('^.*\.s3\.([^.]+)\.amazonaws\.com$', '\1') }}
    delegate_to: localhost
    # no_log: true

  - name: Copy AAP licence to bastion
    ansible.builtin.copy:
      src: /tmp/aap-licence.zip
      dest: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/demo/license.zip"
      mode: ug=rw,go=r

- name: Label storage class for OSAC Tenant
  kubernetes.core.k8s:
    state: patched
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ ocp4_workload_osac_storage_class }}"
    definition:
      metadata:
        labels:
          osac.openshift.io/tenant: shared
          osac.openshift.io/storage-tier: default
