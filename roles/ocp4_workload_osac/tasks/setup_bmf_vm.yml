---
- name: Set up BMF VM
  delegate_to: bmf_vm
  block:
  - name: Install KVM and Sushy dependencies
    ansible.builtin.dnf:
      state: present
      name:
      - qemu-kvm
      - libvirt
      - virt-install
      - python3-pip
      - python3-devel
      - gcc
      - pkgconf-pkg-config
      - python3-libvirt
      - coreos-installer

  - name: Enable libvirt sockets
    ansible.builtin.systemd:
      name: "{{ item }}"
      enabled: true
      state: started
    loop:
    - virtqemud.socket
    - virtnetworkd.socket
    - virtstoraged.socket

  - name: Start virtqemud service so daemon is ready before sushy connects
    ansible.builtin.systemd:
      name: virtqemud.service
      state: started
      enabled: true

  - name: Start default libvirt network (creates virbr0)
    ansible.builtin.command: virsh net-start default
    register: _virsh_net_start
    failed_when:
    - _virsh_net_start.rc != 0
    - '"already active" not in _virsh_net_start.stderr'
    changed_when: _virsh_net_start.rc == 0

  - name: Set default libvirt network to autostart
    ansible.builtin.command: virsh net-autostart default
    register: _virsh_net_auto
    changed_when: '"marked as autostarted" in _virsh_net_auto.stdout'

  - name: Install sushy-tools into virtual environment
    ansible.builtin.pip:
      name:
      - pip
      - sushy-tools==2.1.0
      virtualenv: /opt/sushy
      virtualenv_command: python3 -m venv --system-site-packages
      state: present

  - name: Create sushy config directory
    ansible.builtin.file:
      path: /etc/sushy
      state: directory
      mode: ug=rwx,o=rx

  - name: Write sushy configuration
    ansible.builtin.copy:
      dest: /etc/sushy/sushy-emulator.conf
      mode: ug=rw,go=r
      content: |
        SUSHY_EMULATOR_LISTEN_IP = u'0.0.0.0'
        SUSHY_EMULATOR_LISTEN_PORT = 8000
        SUSHY_EMULATOR_LIBVIRT_URI = u'qemu:///system'

  - name: Write sushy systemd unit
    ansible.builtin.copy:
      dest: /etc/systemd/system/sushy-emulator.service
      mode: ug=rw,go=r
      content: |
        [Unit]
        Description=Sushy Redfish emulator
        After=network.target virtqemud.socket

        [Service]
        ExecStart=/opt/sushy/bin/sushy-emulator --config /etc/sushy/sushy-emulator.conf
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target

  - name: Enable and start sushy-emulator
    ansible.builtin.systemd:
      name: sushy-emulator
      enabled: true
      state: started
      daemon_reload: true

  - name: Disable reverse path filtering for the asymmetric guest return path
    ansible.builtin.copy:
      dest: /etc/sysctl.d/99-osac-bmf.conf
      mode: ug=rw,go=r
      owner: root
      group: root
      content: |
        net.ipv4.conf.all.rp_filter = 0
        net.ipv4.conf.default.rp_filter = 0
        net.ipv4.conf.enp2s0.rp_filter = 0
        net.ipv4.conf.virbr0.rp_filter = 0
    register: _bmf_sysctl

  - name: Apply rp_filter settings
    when: _bmf_sysctl is changed
    ansible.builtin.command: sysctl -p /etc/sysctl.d/99-osac-bmf.conf
    changed_when: true

  - name: Install OSAC BMF nftables script
    ansible.builtin.copy:
      src: osac-bmf-nft.sh
      dest: /usr/local/sbin/osac-bmf-nft
      mode: u=rwx,go=rx
      owner: root
      group: root

  - name: Write OSAC BMF nftables service and timer
    ansible.builtin.copy:
      dest: "/etc/systemd/system/{{ item.name }}"
      mode: ug=rw,go=r
      content: "{{ item.content }}"
      owner: root
      group: root
    loop:
    - name: osac-bmf-nft.service
      content: |
        [Unit]
        Description=OSAC BMF forwarding and NAT rules
        Wants=network-online.target
        After=network-online.target nftables.service virtnetworkd.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/osac-bmf-nft

        [Install]
        WantedBy=multi-user.target
    # ponytail: timer re-probes which hub node serves metal3 :6180, so the DNAT follows the pod
    - name: osac-bmf-nft.timer
      content: |
        [Unit]
        Description=Re-apply OSAC BMF nftables rules

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec=2min

        [Install]
        WantedBy=timers.target
    loop_control:
      label: "{{ item.name }}"

  # A libvirt network hook can't be used: SELinux denies virtnetworkd_t executing virt_hook_t,
  # and a failing hook breaks every VM attach. Remove any hook left by earlier role versions.
  - name: Remove libvirt network hook
    ansible.builtin.file:
      path: /etc/libvirt/hooks/network
      state: absent
    register: _bmf_libvirt_hook

  # virtnetworkd rebuilds table ip libvirt_network on start; the timer covers net-destroy/net-start
  - name: Create virtnetworkd drop-in directory
    ansible.builtin.file:
      path: /etc/systemd/system/virtnetworkd.service.d
      state: directory
      mode: u=rwx,go=rx

  - name: Re-apply OSAC BMF nftables rules whenever virtnetworkd starts
    ansible.builtin.copy:
      dest: /etc/systemd/system/virtnetworkd.service.d/osac-nft.conf
      mode: ug=rw,go=r
      owner: root
      group: root
      content: |
        [Service]
        ExecStartPost=-/usr/bin/systemctl start --no-block osac-bmf-nft.service
    register: _bmf_virtnetworkd_dropin

  - name: Restart virtnetworkd to drop the hook and load the drop-in
    when: _bmf_libvirt_hook is changed or _bmf_virtnetworkd_dropin is changed
    ansible.builtin.systemd:
      name: virtnetworkd.service
      state: restarted
      daemon_reload: true
  - name: Apply OSAC BMF nftables rules
    ansible.builtin.systemd:
      name: osac-bmf-nft.service
      state: restarted
      daemon_reload: true

  - name: Verify libvirt guest_input allows hub -> guest :443 and Ironic :9999
    ansible.builtin.command: nft list chain ip libvirt_network guest_input
    register: _bmf_guest_input
    changed_when: false
    failed_when: "'tcp dport { 80, 443, 9999 }' not in _bmf_guest_input.stdout"

  - name: Enable OSAC BMF nftables service and timer at boot
    ansible.builtin.systemd:
      name: "{{ item }}"
      enabled: true
    loop:
    - osac-bmf-nft.service
    - osac-bmf-nft.timer

  - name: Start OSAC BMF nftables timer
    ansible.builtin.systemd:
      name: osac-bmf-nft.timer
      state: started

  # The on-disk nftables config is an empty template: a reload would wipe the lab ruleset
  - name: Read live nftables ruleset (without libvirt/firewalld tables)
    ansible.builtin.shell: >-
      set -o pipefail;
      nft list tables | grep -Ev 'libvirt|firewalld' |
      while read -r _ family name; do nft list table "$family" "$name"; done
    register: _nft_live
    changed_when: false

  - name: Persist nftables ruleset to /etc/sysconfig/nftables.conf
    ansible.builtin.copy:
      dest: /etc/sysconfig/nftables.conf
      mode: u=rw,go=
      owner: root
      group: root
      content: "{{ _nft_live.stdout }}\n"

  - name: Enable nftables service to load the persisted ruleset at boot
    ansible.builtin.systemd:
      name: nftables.service
      enabled: true

  # nftables.service flushes the whole ruleset on reload/restart, including libvirt's table.
  # Restarting virtnetworkd rebuilds that table, and its drop-in re-runs osac-bmf-nft.
  - name: Create nftables drop-in directory
    ansible.builtin.file:
      path: /etc/systemd/system/nftables.service.d
      state: directory
      mode: u=rwx,go=rx

  - name: Rebuild libvirt and OSAC rules after nftables reload/restart
    ansible.builtin.copy:
      dest: /etc/systemd/system/nftables.service.d/osac-nft.conf
      mode: ug=rw,go=r
      owner: root
      group: root
      content: |
        [Service]
        ExecStartPost=-/usr/bin/systemctl try-restart --no-block virtnetworkd.service
        ExecReload=-/usr/bin/systemctl try-restart --no-block virtnetworkd.service

  - name: Reload systemd for the nftables drop-in
    ansible.builtin.systemd:
      daemon_reload: true
