---
- name: Set values file path
  ansible.builtin.set_fact:
    ocp4_workload_osac_installer_values_file: >-
      {{ ocp4_workload_osac_installer_values_directory }}/values.yaml

- name: Setup Helm deployment options
  delegate_to: "{{ _bastion_host }}"
  block:
  - name: Disable cert-manager deployment in operators chart (pre-installed via platform)
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/infra.yaml
      regexp: '(certManager:\n\s+enabled:\s+)\w+'
      replace: '\g<1>false'

  - name: Disable LVM Storage in values file
    when: not ocp4_workload_osac_lvms_enabled | bool
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/infra.yaml
      regexp: '(lvms:\n\s+enabled:\s+)\w+'
      replace: '\g<1>false'

  - name: Set up LVM Storage
    when: ocp4_workload_osac_lvms_enabled | bool
    block:
    - name: Patch LVMS operator chart namespace to openshift-lvm-storage in osac-deps
      ansible.builtin.replace:
        path: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-deps/templates/lvms.yaml
        regexp: openshift-storage
        replace: openshift-lvm-storage

    - name: Patch LVMS operator chart namespace to openshift-lvm-storage in osac-infra
      ansible.builtin.replace:
        path: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/lvms.yaml
        regexp: openshift-storage
        replace: openshift-lvm-storage

    - name: Patch LVMCluster with configured disk paths in osac-infra
      when: ocp4_workload_osac_lvms_disks | length > 0
      ansible.builtin.template:
        src: lvms-cluster-config.yaml.j2
        dest: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/lvms.yaml
        owner: "{{ ansible_user }}"
        mode: ug=rw,o=r

    - name: Patch LVMS configure-lvms.sh namespace to openshift-lvm-storage in osac-infra
      ansible.builtin.replace:
        path: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/files/hooks/configure-lvms.sh
        regexp: openshift-storage
        replace: openshift-lvm-storage

  - name: Set osac-ui image tag to {{ ocp4_workload_osac_ui_image_tag }}
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/instance.yaml
      regexp: '(ghcr\.io/osac-project/osac-ui:)\S+'
      replace: '\g<1>{{ ocp4_workload_osac_ui_image_tag }}'

  - name: Patch keycloak set-passwords script - exact user lookup
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/keycloak/resources.yaml
      regexp: 'users\?username=\$username"'
      replace: 'users?username=$username&exact=true"'

  - name: Patch keycloak set-passwords script - safe Python indexing
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/keycloak/resources.yaml
      regexp: 'print\(json\.load\(sys\.stdin\)\[0\]\[.id.\]\)\)'
      replace: "data=json.load(sys.stdin); print(data[0]['id']) if data else print(''))"

  - name: Patch keycloak set-passwords script - skip missing users gracefully
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/keycloak/resources.yaml
      regexp: 'Could not find user.*return 1'
      replace: 'User $username not found, skipping"; return 0'

  - name: Set Keycloak admin credentials in values file
    ansible.builtin.lineinfile:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/infra.yaml
      insertafter: '^keycloak:'
      regexp: '^\s+{{ item.key }}:'
      line: '  {{ item.key }}: {{ item.value }}'
    loop:
    - key: adminUsername
      value: "{{ ocp4_workload_osac_admin_user }}"
    - key: adminPassword
      value: "{{ _ocp4_workload_osac_admin_password }}"
    - key: defaultUserPassword
      value: "{{ _ocp4_workload_osac_user_password }}"
    loop_control:
      label: "{{ item.key }}"

  - name: Find Helm hook YAML files
    ansible.builtin.find:
      paths: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts"
      patterns: '*.yaml'
      file_type: file
      recurse: true
    register: r_hook_files

  - name: Increase memory limits in hook jobs
    ansible.builtin.replace:
      path: "{{ item.path }}"
      regexp: 'memory: [0-9]+Mi'
      replace: 'memory: 1Gi'
    loop: "{{ r_hook_files.files | selectattr('path', 'search', '/hooks/') }}"
    loop_control:
      label: "{{ item.path | basename }}"

  - name: Increase backoff limits in hook jobs
    ansible.builtin.replace:
      path: "{{ item.path }}"
      regexp: 'backoffLimit: [0-9]+'
      replace: 'backoffLimit: 30'
    loop: "{{ r_hook_files.files | selectattr('path', 'search', '/hooks/') }}"
    loop_control:
      label: "{{ item.path | basename }}"
