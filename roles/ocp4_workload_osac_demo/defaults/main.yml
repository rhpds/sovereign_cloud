---
# ------------------------------------------------
# OSAC Demo 3 VMaaS Prerequisites
# ------------------------------------------------

# OSAC namespace (must match ocp4_workload_osac role)
ocp4_workload_osac_demo_namespace: osac-demo

# Storage class (must match ocp4_workload_osac role)
ocp4_workload_osac_demo_storage_class: ocs-external-storagecluster-ceph-rbd

# ------------------------------------------------
# Keycloak credentials (from ocp4_workload_osac role)
# ------------------------------------------------
ocp4_workload_osac_demo_admin_user: admin
ocp4_workload_osac_demo_admin_password: ""
ocp4_workload_osac_demo_user_password: ""

# ------------------------------------------------
# Demo tenant
# ------------------------------------------------
ocp4_workload_osac_demo_tenant_name: tenant1
ocp4_workload_osac_demo_tenant_users:
- tenant1_admin
- tenant1_user

# ------------------------------------------------
# PublicIPPool (skip if empty)
# ------------------------------------------------
ocp4_workload_osac_demo_public_ip_cidr: ""
ocp4_workload_osac_demo_public_ip_pool_name: demo-public-pool

# ------------------------------------------------
# InstanceType
# ------------------------------------------------
ocp4_workload_osac_demo_instance_type_name: demo-small-1-2
ocp4_workload_osac_demo_instance_type_cores: 1
ocp4_workload_osac_demo_instance_type_memory_gib: 2
ocp4_workload_osac_demo_instance_type_description: >-
  Demo VM size: 1 vCPU, 2 GiB RAM

# ------------------------------------------------
# CatalogItem
# ------------------------------------------------
ocp4_workload_osac_demo_catalog_item_name: demo-linux-vm
